name: Sync Middleware Version

# Keeps the @appwarden/middleware version pinned in dist/ in sync with the
# latest version published to npm.
#
# This is pull-based on purpose. It does not depend on cross-repo events from
# appwarden/middleware: GitHub suppresses workflow runs for events created with
# the repository GITHUB_TOKEN, so a release published by that repo's own release
# workflow can no longer trigger anything here.

on:
  schedule:
    # Every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [middleware-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to latest @appwarden/middleware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: |
          # Set safer npm config
          npm config set ignore-scripts true
          npm config set audit true

          # Install dependencies with frozen lockfile for reproducibility
          npm ci --ignore-scripts
        env:
          # Disable progress bars for cleaner logs
          NPM_CONFIG_PROGRESS: "false"

      - name: Check for middleware drift
        id: drift
        run: |
          # `.middleware-version` is the source of truth for the build, so drift is
          # simply "npm has published something newer than the pin".
          PINNED=$(cat .middleware-version)
          LATEST=$(npm view @appwarden/middleware version)

          if [[ -z "$LATEST" ]]; then
            echo "::error::Failed to resolve the latest @appwarden/middleware version"
            exit 1
          fi

          echo "middleware_version=$LATEST" >> "$GITHUB_OUTPUT"

          if [[ "$LATEST" == "$PINNED" ]]; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
            echo "In sync with @appwarden/middleware@$LATEST"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
            echo "Drift detected: .middleware-version pins $PINNED, npm has $LATEST"
          fi

      - name: Open or update sync pull request
        if: steps.drift.outputs.in_sync == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.drift.outputs.middleware_version }}"
          BRANCH="chore/middleware-sync"
          TITLE="chore(release): sync @appwarden/middleware to $VERSION"

          git fetch origin "$BRANCH" 2>/dev/null || true

          # The middleware version the existing sync branch was built with, if any
          PREVIOUS_VERSION=""
          if git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
            PREVIOUS_VERSION=$(git show "origin/$BRANCH:.middleware-version" 2>/dev/null || true)
          fi

          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')

          # Respect a deliberate close: never re-propose a version that was
          # already reviewed and closed without merging.
          if [[ "$PREVIOUS_VERSION" == "$VERSION" && "$OPEN_PR" == "0" ]]; then
            echo "Version $VERSION was already proposed and closed without merging; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Move the pin forward, then rebuild dist/ against it.
          echo "$VERSION" > .middleware-version
          npm run build

          cat > .changeset/middleware-sync.md << EOF
          ---
          "@appwarden/build-cloudflare-action": minor
          ---

          Sync @appwarden/middleware to version $VERSION
          EOF

          git add dist .middleware-version .changeset/middleware-sync.md
          git commit -m "$TITLE"

          if git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null &&
            git diff --quiet "origin/$BRANCH" HEAD; then
            echo "Branch $BRANCH already contains $VERSION"
          else
            git push --force origin "$BRANCH"
          fi

          PR_BODY=$(cat << EOF
          ## Middleware sync

          \`@appwarden/middleware\` is published at **$VERSION**, but the version bundled into \`dist/\` was older.

          ### Changes
          - Rebuilt \`dist/\` against \`@appwarden/middleware@$VERSION\`
          - Recorded the pinned version in \`.middleware-version\`
          - Added a changeset for the version bump

          ---
          *Opened by the \`middleware-sync\` workflow, which runs every 3 hours.*
          EOF
          )

          if [[ "$OPEN_PR" != "0" ]]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$PR_BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$PR_BODY"
          fi
